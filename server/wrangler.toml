# Cloudflare Worker deployment for the TRALIX backend.
#
#   npx wrangler deploy server/worker.js --name tralix-backend
#   npx wrangler secret put OPENAI_API_KEY
#
# This is an optional split deployment. Set TRALIX_ALLOWED_ORIGINS to the
# Render frontend's actual origin and use the worker URL in backend.json. Leave
# backend.json empty for the combined Render app/API service.
#
# The key is a secret, never a var:
#   npx wrangler secret put OPENAI_API_KEY

name = "tralix-backend"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# For the Render frontend, set this to its actual public origin:
#   "https://jarvis-ai.onrender.com,http://localhost:8787"
TRALIX_ALLOWED_ORIGINS = "https://jarvis-ai.onrender.com"
TRALIX_ENABLE_WEB_SEARCH = "false"

# Secrets (set with `wrangler secret put`, never in this file):
#   OPENAI_API_KEY
#
# Optional overrides:
# [vars]
# TRALIX_MODEL_SMART = "gpt-5"
