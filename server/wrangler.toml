# Cloudflare Worker deployment for the TRALIX backend.
#
#   npx wrangler deploy server/worker.js --name tralix-backend
#   npx wrangler secret put OPENAI_API_KEY
#
# Then put the worker URL in ./backend.json so the GitHub Pages frontend finds
# it, or paste it into TRALIX → Settings → Advanced → Backend URL for one device.
#
# The key is a secret, never a var:
#   npx wrangler secret put OPENAI_API_KEY

name = "tralix-backend"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# Lock this to your deployed frontend origin once it works:
#   "https://tralix-scokt.github.io,http://localhost:8787"
TRALIX_ALLOWED_ORIGINS = "https://tralix-scokt.github.io"
TRALIX_ENABLE_WEB_SEARCH = "false"

# Secrets (set with `wrangler secret put`, never in this file):
#   OPENAI_API_KEY
#
# Optional overrides:
# [vars]
# TRALIX_MODEL_SMART = "gpt-5"
