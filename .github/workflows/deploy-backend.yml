# ============================================================================
# Deploys the TRALIX backend (server/worker.js) to Cloudflare Workers.
#
# This is an optional separate-API deployment; the recommended Render Blueprint
# serves the frontend and API together. No secret is written into the repository —
# the key is read from GitHub Actions secrets and pushed as an encrypted secret.
#
# One-time setup (repository → Settings → Secrets and variables → Actions):
#   Secrets:  CLOUDFLARE_API_TOKEN     (Workers Scripts: Edit permission)
#             CLOUDFLARE_ACCOUNT_ID
#             OPENAI_API_KEY           (the real key — never committed)
#   Variables (optional):
#             TRALIX_ALLOWED_ORIGINS   default: https://jarvis-ai.onrender.com
#             TRALIX_MODEL_SMART etc.  tier → model overrides
#
# If deliberately using this separate Worker with the Render frontend, set the
# allowed origin to the actual Render app URL and put the printed Worker URL in
# backend.json. Leave backend.json's url empty for the combined Render service.
# ============================================================================
name: Deploy TRALIX backend

on:
  workflow_dispatch:
    inputs:
      allowed_origins:
        description: 'Comma-separated origins allowed to call the API'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

concurrency:
  group: tralix-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check that the required secrets exist
        run: |
          missing=0
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ -n "${{ secrets.OPENAI_API_KEY }}" ] || { echo "::error::OPENAI_API_KEY is not set"; missing=1; }
          exit $missing

      - name: Deploy the worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: >-
            deploy worker.js
            --name tralix-backend
            --var TRALIX_ALLOWED_ORIGINS:${{ github.event.inputs.allowed_origins || vars.TRALIX_ALLOWED_ORIGINS || 'https://jarvis-ai.onrender.com' }}
            --var TRALIX_ENABLE_WEB_SEARCH:${{ vars.TRALIX_ENABLE_WEB_SEARCH || 'false' }}
            ${{ vars.TRALIX_MODEL_SMART && format('--var TRALIX_MODEL_SMART:{0}', vars.TRALIX_MODEL_SMART) || '' }}

      # The key is pushed straight from the runner to Cloudflare as an encrypted
      # secret. It is never echoed, never written to a file and never committed.
      - name: Set the OpenAI key as a worker secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          quiet: true
          command: secret put OPENAI_API_KEY
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Verify the deployment answers
        if: steps.deploy.outputs.command-output != ''
        run: |
          URL=$(echo "${{ steps.deploy.outputs.deployment-url }}" | tr -d '[:space:]')
          echo "worker URL: $URL"
          echo "### JARVIS backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: \`$URL/api/health?probe=1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "For a split deployment only: put \`$URL\` in \`backend.json\` (url field) and set the allowed origin to the Render app URL." >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/api/health" | head -c 600 || echo "health check pending — run it again in a minute"
